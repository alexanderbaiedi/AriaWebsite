openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: interpreter-applications
    description: Interpreter application operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /interpreter-applications:
    post:
      operationId: createInterpreterApplication
      tags: [interpreter-applications]
      summary: Submit an interpreter application
      description: Sends a careers interpreter application to ARIA by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterpreterApplicationRequest"
      responses:
        "201":
          description: Application email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterpreterApplicationResponse"
        "400":
          description: Invalid application payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          description: Email is not configured
        "502":
          description: Email provider failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InterpreterApplicationRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
        languages:
          type: string
      required:
        - fullName
        - phone
        - email
        - languages
    InterpreterApplicationResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ValidationErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        errors:
          type: object
          additionalProperties:
            type: string
      required:
        - ok
        - errors

