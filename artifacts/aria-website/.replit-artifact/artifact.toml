kind = "web"
previewPath = "/"
title = "Aria Language Services"
version = "1.0.0"
id = "artifacts/aria-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24976

[services.development]
run = "pnpm --filter @workspace/aria-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aria-website", "run", "build" ]
publicDir = "artifacts/aria-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24976"
BASE_PATH = "/"
